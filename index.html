<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calisthenics Form & Technique Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>CALISTHENICS TECH HUB</h1>
    <p>Master bodyweight movements with precision form.</p>
  </header>

  <main>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search exercise (e.g., Pull-Up, Dip)...">
      <div class="filter-buttons">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="pull">Pull</button>
        <button class="filter-btn" data-category="push">Push</button>
        <button class="filter-btn" data-category="core">Core</button>
      </div>
    </div>

    <div id="exerciseGrid" class="exercise-grid">
      <!-- Dynamic Exercise Cards Will Render Here -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
